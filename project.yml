name: HribiVZepu
options:
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  HikeKit:
    path: HikeKit
targets:
  HribiVZepu:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HikeKit
      - target: ShareExtension
    entitlements:
      path: App/HribiVZepu.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.gaivo.HribiVZepu
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hribi v žepu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # HTTPS only, which is exempt; saves the export compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        # App Store Connect rejects a bundle without these.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Lokacija se uporabi samo za shranjevanje trenutnega mesta kot izhodišča za izračun časa vožnje do izletov.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaivo.HribiVZepu
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    dependencies:
      - package: HikeKit
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.gaivo.HribiVZepu
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Hribi v žepu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gaivo.HribiVZepu.Share
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  HribiVZepu:
    build:
      targets:
        HribiVZepu: all
    run:
      config: Debug
    archive:
      config: Release
